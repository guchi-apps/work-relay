name: CI

# 注意: claude-conflict-resolve.ymlが、このワークフローの`workflow_run`（CI / requested /
# develop）を「developへのpush」の代理通知として購読している（guchi-apps/issue-deck#1330。
# claude-code-actionがpushイベントに対応していないため直接pushで受けられない）。したがって
# - ワークフロー名（`CI`）
# - `push: branches: [develop]`トリガー
# を変更・削除すると、コンフリクト自動解消の最速検知経路が無言で止まる（scheduleの15分
# おきの安全網だけが残る）。変更する場合はclaude-conflict-resolve.ymlも合わせて直す。
#
# **このファイルはissue-deckの画面の「新規アプリを立ち上げる」が置いた雛形である**
# （guchi-apps/issue-deck#2247）。検証コマンドを増やしたら、このジョブにも足すこと。

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # DBに繋がない純粋なロジックの単体テスト（node:test）。TypeScriptのままNodeが読む
      # （Node 24の型剥がし）ため、追加の依存もビルド手順も要らない。
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build:ci
        env:
          NODE_ENV: production
          # ビルドは外部サービスへ接続しないため、いずれもCI専用のプレースホルダーでよい。
          DATABASE_URL: mysql://placeholder:placeholder@127.0.0.1:3306/app_research_desk
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
