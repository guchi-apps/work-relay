name: Deploy to Production

# mainへのpushでVPSへ配る。**このファイルはissue-deckの画面の「新規アプリを立ち上げる」が
# 置いた雛形である**（guchi-apps/issue-deck#2247）。
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-research-desk-production
  cancel-in-progress: true

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create Git tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          HEAD_SHA=$(git rev-parse HEAD)

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-parse "$TAG")
            if [ "$TAG_SHA" = "$HEAD_SHA" ]; then
              echo "Tag ${TAG} already points to HEAD"
              exit 0
            fi
            echo "::error::Tag ${TAG} already exists on ${TAG_SHA}, but HEAD is ${HEAD_SHA}. Bump package.json version before merging."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

  release:
    runs-on: ubuntu-latest
    needs: [tag, deploy]
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect prerelease
        id: meta
        run: |
          TAG="${{ needs.tag.outputs.tag }}"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          skip_if_release_exists: true

  build:
    runs-on: ubuntu-latest
    needs: tag

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んで
    # いたが、サービスアカウントの日次レート制限を使い切ってフリート全体の
    # デプロイが止まった（guchi-apps/issue-deck#1302）。SERVER_*・SHARED_DB_*・SUPABASE_*
    # はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（guchi-apps/issue-deck#1307）。
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      HOST: ${{ secrets.SERVER_HOST }}
      USERNAME: ${{ secrets.SERVER_USERNAME }}
      SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
      DB_HOST: ${{ secrets.SHARED_DB_HOST }}
      DB_PORT: ${{ secrets.SHARED_DB_PORT }}
      DB_USER: ${{ secrets.SHARED_DB_USER }}
      DB_PASSWORD: ${{ secrets.SHARED_DB_PASSWORD }}
      MIGRATE_DB_USER: ${{ secrets.SHARED_DB_MIGRATE_USER }}
      MIGRATE_DB_PASSWORD: ${{ secrets.SHARED_DB_MIGRATE_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_PROJECT_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      ALLOWED_GOOGLE_EMAILS: ${{ secrets.ALLOWED_GOOGLE_EMAILS }}
      INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
      ANALYSIS_WORKER_SECRET: ${{ secrets.ANALYSIS_WORKER_SECRET }}
      OPS_API_TOKEN: ${{ secrets.OPS_API_TOKEN }}
      COLLECTION_CRON_SECRET: ${{ secrets.COLLECTION_CRON_SECRET }}
      SHARE_SHORTCUT_TOKEN: ${{ secrets.SHARE_SHORTCUT_TOKEN }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      AIDE_BOT_URL: ${{ vars.AIDE_BOT_URL }}
      AIDE_BOT_TOKEN: ${{ secrets.AIDE_BOT_TOKEN }}
      AIDE_BOT_EMAIL: ${{ secrets.AIDE_BOT_EMAIL }}
      AIDE_IMAGE_MAIL_URL: ${{ vars.AIDE_IMAGE_MAIL_URL }}
      AIDE_IMAGE_MAIL_TOKEN: ${{ secrets.AIDE_IMAGE_MAIL_TOKEN }}
      AIDE_NEWS_MAIL_URL: ${{ vars.AIDE_NEWS_MAIL_URL }}
      AIDE_NEWS_MAIL_TOKEN: ${{ secrets.AIDE_NEWS_MAIL_TOKEN }}
      AIDE_TEXT_MAIL_URL: ${{ vars.AIDE_TEXT_MAIL_URL }}
      AIDE_TEXT_MAIL_TOKEN: ${{ secrets.AIDE_TEXT_MAIL_TOKEN }}
      SHARED_TOKEN_API_SECRET: ${{ secrets.SHARED_TOKEN_API_SECRET }}
      ISSUE_DECK_URL: ${{ vars.APP_BASE_URL }}
      TARGET_DIR: ${{ secrets.TARGET_DIR }}
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Construct DATABASE_URL
        run: bash scripts/construct-database-url.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:ci
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ env.DATABASE_URL }}
          # NEXT_PUBLIC_* はビルド時にバンドルへ埋め込まれるため、ここにも渡す。
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      # 実行時に使うファイルだけを固める。scripts/codex-analysis-worker.mjs は記事AI解析のポーラー
      # （deploy/ecosystem.config.js の research-desk-analysis-worker）が実行するので外さない。
      # .env の更新はgateが行うため scripts/update-env-file.sh は配らない（#302）。
      - name: Create archive
        run: |
          tar -czf deploy.tar.gz \
            package.json \
            pnpm-lock.yaml \
            public \
            .next \
            prisma \
            deploy \
            scripts/codex-analysis-worker.mjs \
            next.config.mjs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: deploy.tar.gz
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んで
    # いたが、サービスアカウントの日次レート制限を使い切ってフリート全体の
    # デプロイが止まった（guchi-apps/issue-deck#1302）。SERVER_*・SHARED_DB_*・SUPABASE_*
    # はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（guchi-apps/issue-deck#1307）。
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      HOST: ${{ secrets.SERVER_HOST }}
      USERNAME: ${{ secrets.SERVER_USERNAME }}
      SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
      DB_HOST: ${{ secrets.SHARED_DB_HOST }}
      DB_PORT: ${{ secrets.SHARED_DB_PORT }}
      DB_USER: ${{ secrets.SHARED_DB_USER }}
      DB_PASSWORD: ${{ secrets.SHARED_DB_PASSWORD }}
      MIGRATE_DB_USER: ${{ secrets.SHARED_DB_MIGRATE_USER }}
      MIGRATE_DB_PASSWORD: ${{ secrets.SHARED_DB_MIGRATE_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_PROJECT_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      ALLOWED_GOOGLE_EMAILS: ${{ secrets.ALLOWED_GOOGLE_EMAILS }}
      INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
      ANALYSIS_WORKER_SECRET: ${{ secrets.ANALYSIS_WORKER_SECRET }}
      OPS_API_TOKEN: ${{ secrets.OPS_API_TOKEN }}
      COLLECTION_CRON_SECRET: ${{ secrets.COLLECTION_CRON_SECRET }}
      SHARE_SHORTCUT_TOKEN: ${{ secrets.SHARE_SHORTCUT_TOKEN }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      AIDE_BOT_URL: ${{ vars.AIDE_BOT_URL }}
      AIDE_BOT_TOKEN: ${{ secrets.AIDE_BOT_TOKEN }}
      AIDE_BOT_EMAIL: ${{ secrets.AIDE_BOT_EMAIL }}
      AIDE_IMAGE_MAIL_URL: ${{ vars.AIDE_IMAGE_MAIL_URL }}
      AIDE_IMAGE_MAIL_TOKEN: ${{ secrets.AIDE_IMAGE_MAIL_TOKEN }}
      AIDE_NEWS_MAIL_URL: ${{ vars.AIDE_NEWS_MAIL_URL }}
      AIDE_NEWS_MAIL_TOKEN: ${{ secrets.AIDE_NEWS_MAIL_TOKEN }}
      AIDE_TEXT_MAIL_URL: ${{ vars.AIDE_TEXT_MAIL_URL }}
      AIDE_TEXT_MAIL_TOKEN: ${{ secrets.AIDE_TEXT_MAIL_TOKEN }}
      SHARED_TOKEN_API_SECRET: ${{ secrets.SHARED_TOKEN_API_SECRET }}
      ISSUE_DECK_URL: ${{ vars.APP_BASE_URL }}
      TARGET_DIR: ${{ secrets.TARGET_DIR }}
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: ./

      - name: Construct DATABASE_URL
        run: bash scripts/construct-database-url.sh

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ env.SSH_PRIVATE_KEY }}
          known_hosts: placeholder
          if_key_exists: replace

      - name: Add known hosts
        run: ssh-keyscan -p "${SSH_PORT}" -H "${HOST}" >> ~/.ssh/known_hosts
        env:
          HOST: ${{ env.HOST }}
          SSH_PORT: ${{ env.SSH_PORT }}

      # **VPSのgate（/usr/local/sbin/app-deploy-gate。guchi-apps/vps#275）へ渡す**（#302）。
      # 鍵はこのアプリ専用で、VPSのauthorized_keysのcommand=がgateのアプリ名（research-desk。置き場の
      # /home/github-user/apps/research-desk とpm2のプロセス名に一致する。リポジトリ名はwork-relayへ
      # 変えたが、置き場・pm2・DB名は旧名のまま）を固定する。任意のシェルコマンドは実行できず、
      # upload・env・deployの3語だけが通る。旧配布物の削除・展開・.env更新・pnpm install・
      # prisma migrate deploy（MIGRATE_DATABASE_URLは.envへ書かずここだけで使う）・pm2の再起動
      # （deploy/ecosystem.config.jsが宣言するresearch-deskとresearch-desk-analysis-workerの両方を
      # pm2 deleteしてから起動し直す）・稼働版の照合はgate側が行う。
      - name: Upload archive
        run: ssh -p "${SSH_PORT}" "${USERNAME}@${HOST}" upload < deploy.tar.gz
        env:
          HOST: ${{ env.HOST }}
          USERNAME: ${{ env.USERNAME }}
          SSH_PORT: ${{ env.SSH_PORT }}

      - name: Send environment variables
        env:
          HOST: ${{ env.HOST }}
          USERNAME: ${{ env.USERNAME }}
          SSH_PORT: ${{ env.SSH_PORT }}
          # 稼働している版の照合に使う（#302）。gateが.envのAPP_COMMIT_SHAと稼働中の
          # /api/app-versionのshaを照合する（guchi-apps/vps#298）。コミットのSHAは公開情報
          APP_COMMIT_SHA: ${{ github.sha }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
          MIGRATE_DATABASE_URL: ${{ env.MIGRATE_DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          ALLOWED_GOOGLE_EMAILS: ${{ env.ALLOWED_GOOGLE_EMAILS }}
          INTERNAL_API_KEY: ${{ env.INTERNAL_API_KEY }}
          ANALYSIS_WORKER_SECRET: ${{ env.ANALYSIS_WORKER_SECRET }}
          OPS_API_TOKEN: ${{ env.OPS_API_TOKEN }}
          COLLECTION_CRON_SECRET: ${{ env.COLLECTION_CRON_SECRET }}
          SHARE_SHORTCUT_TOKEN: ${{ env.SHARE_SHORTCUT_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ env.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ env.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ env.VAPID_SUBJECT }}
          AIDE_BOT_URL: ${{ env.AIDE_BOT_URL }}
          AIDE_BOT_TOKEN: ${{ env.AIDE_BOT_TOKEN }}
          AIDE_BOT_EMAIL: ${{ env.AIDE_BOT_EMAIL }}
          AIDE_IMAGE_MAIL_URL: ${{ env.AIDE_IMAGE_MAIL_URL }}
          AIDE_IMAGE_MAIL_TOKEN: ${{ env.AIDE_IMAGE_MAIL_TOKEN }}
          AIDE_NEWS_MAIL_URL: ${{ env.AIDE_NEWS_MAIL_URL }}
          AIDE_NEWS_MAIL_TOKEN: ${{ env.AIDE_NEWS_MAIL_TOKEN }}
          AIDE_TEXT_MAIL_URL: ${{ env.AIDE_TEXT_MAIL_URL }}
          AIDE_TEXT_MAIL_TOKEN: ${{ env.AIDE_TEXT_MAIL_TOKEN }}
          SHARED_TOKEN_API_SECRET: ${{ env.SHARED_TOKEN_API_SECRET }}
          ISSUE_DECK_URL: ${{ env.ISSUE_DECK_URL }}
        run: |
          set -euo pipefail
          # マイグレーション専用ユーザー（DDL権限あり）が未設定のときは通常ユーザーで流す。
          # 空のまま送るとgateはマイグレーションを黙って飛ばすため、必ず値を入れて送る。
          MIGRATE_DATABASE_URL="${MIGRATE_DATABASE_URL:-$DATABASE_URL}"
          # gateは標準入力を1行1変数（KEY=VALUE）で受けるため、改行を含む値は送れない。
          for name in DATABASE_URL MIGRATE_DATABASE_URL NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            ALLOWED_GOOGLE_EMAILS INTERNAL_API_KEY ANALYSIS_WORKER_SECRET OPS_API_TOKEN COLLECTION_CRON_SECRET \
            SHARE_SHORTCUT_TOKEN VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY VAPID_SUBJECT AIDE_BOT_URL AIDE_BOT_TOKEN \
            AIDE_BOT_EMAIL AIDE_IMAGE_MAIL_URL AIDE_IMAGE_MAIL_TOKEN AIDE_NEWS_MAIL_URL AIDE_NEWS_MAIL_TOKEN \
            AIDE_TEXT_MAIL_URL AIDE_TEXT_MAIL_TOKEN SHARED_TOKEN_API_SECRET ISSUE_DECK_URL; do
            case "${!name}" in
              *$'\n'*) echo "::error::${name} が改行を含むためgateへ送れません"; exit 1 ;;
            esac
          done
          # 待受ポートはシークレットではなく設定値として平文で持つ
          # （guchi-apps/docs の standards/ports.md「ポート番号は 1Password で管理しない」）。
          {
            printf '%s\n' "NODE_ENV=production" "PORT=3115"
            printf '%s\n' "APP_COMMIT_SHA=${APP_COMMIT_SHA}"
            printf '%s\n' "DATABASE_URL=${DATABASE_URL}"
            printf '%s\n' "MIGRATE_DATABASE_URL=${MIGRATE_DATABASE_URL}"
            printf '%s\n' "NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}"
            printf '%s\n' "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}"
            printf '%s\n' "ALLOWED_GOOGLE_EMAILS=${ALLOWED_GOOGLE_EMAILS}"
            printf '%s\n' "INTERNAL_API_KEY=${INTERNAL_API_KEY}"
            printf '%s\n' "ANALYSIS_WORKER_SECRET=${ANALYSIS_WORKER_SECRET}"
            printf '%s\n' "OPS_API_TOKEN=${OPS_API_TOKEN}"
            printf '%s\n' "COLLECTION_CRON_SECRET=${COLLECTION_CRON_SECRET}"
            printf '%s\n' "SHARE_SHORTCUT_TOKEN=${SHARE_SHORTCUT_TOKEN}"
            printf '%s\n' "VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}"
            printf '%s\n' "VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}"
            printf '%s\n' "VAPID_SUBJECT=${VAPID_SUBJECT}"
            printf '%s\n' "AIDE_BOT_URL=${AIDE_BOT_URL}"
            printf '%s\n' "AIDE_BOT_TOKEN=${AIDE_BOT_TOKEN}"
            printf '%s\n' "AIDE_BOT_EMAIL=${AIDE_BOT_EMAIL}"
            printf '%s\n' "AIDE_IMAGE_MAIL_URL=${AIDE_IMAGE_MAIL_URL}"
            printf '%s\n' "AIDE_IMAGE_MAIL_TOKEN=${AIDE_IMAGE_MAIL_TOKEN}"
            printf '%s\n' "AIDE_NEWS_MAIL_URL=${AIDE_NEWS_MAIL_URL}"
            printf '%s\n' "AIDE_NEWS_MAIL_TOKEN=${AIDE_NEWS_MAIL_TOKEN}"
            printf '%s\n' "AIDE_TEXT_MAIL_URL=${AIDE_TEXT_MAIL_URL}"
            printf '%s\n' "AIDE_TEXT_MAIL_TOKEN=${AIDE_TEXT_MAIL_TOKEN}"
            printf '%s\n' "SHARED_TOKEN_API_SECRET=${SHARED_TOKEN_API_SECRET}"
            printf '%s\n' "ISSUE_DECK_URL=${ISSUE_DECK_URL}"
          } | ssh -p "${SSH_PORT}" "${USERNAME}@${HOST}" env

      # 記事AI解析のポーラー（research-desk-analysis-worker・#86）が online かの確認（従来は警告のみ）は、
      # gateが任意のコマンドを通さないためここでは行わない。gateはNext.js本体の稼働版（sha）だけを照合する。
      - name: Deploy and restart
        run: ssh -p "${SSH_PORT}" "${USERNAME}@${HOST}" deploy
        env:
          HOST: ${{ env.HOST }}
          USERNAME: ${{ env.USERNAME }}
          SSH_PORT: ${{ env.SSH_PORT }}

      # **deployジョブの成功は公開できたことを保証しない**（guchi-apps/issue-deck#2252）。
      # 上のヘルスチェックが叩くのはVPS内の127.0.0.1で、ApacheのVirtualHostが無くても通る。
      # ここで公開URLを外から引き、DNS・Apache・TLSまで通っているかを確かめる。
      #
      # **失敗させない。** certbot前・DNS未反映の初回デプロイは必ず落ちるため、
      # 警告として出すだけにする（初回だけの分岐も持たない。2回目以降もApacheの設定や
      # プロセスが壊れていれば拾えるほうがよい）。
      - name: 公開URLの疎通を確認する（警告のみ）
        continue-on-error: true
        run: |
          URL="https://research-desk.gucchii.com/"
          # 失敗時もcurl自身が %{http_code} に 000 を出す。パイプで 000 を足すと
          # 2行になって数値比較が壊れるので、終了コードだけを握りつぶす
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' -I --max-time 20 "$URL") || true
          [ -n "$CODE" ] || CODE=000
          if [ "$CODE" -ge 200 ] && [ "$CODE" -lt 400 ]; then
            echo "$URL -> $CODE"
          else
            echo "::warning::$URL が開けませんでした（HTTP $CODE）。デプロイ自体は成功しています。DNSのAレコード・ApacheのVirtualHost・TLS証明書を確認してください。"
          fi

  notify:
    runs-on: ubuntu-latest
    needs: [tag, build, deploy]
    if: always()

    env:
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine workflow status
        id: status
        run: |
          tag="${{ needs.tag.result }}"
          build="${{ needs.build.result }}"
          deploy="${{ needs.deploy.result }}"
          if [ "$tag" = "success" ] && [ "$build" = "success" ] && [ "$deploy" = "success" ]; then
            result=success
          elif [ "$tag" = "cancelled" ] || [ "$build" = "cancelled" ] || [ "$deploy" = "cancelled" ]; then
            result=cancelled
          else
            result=failure
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Signaly に通知
        # 通知はCIやデプロイの合否そのものではない。ここが失敗してもrun全体を
        # 落とさない（guchi-apps/issue-deck#1302）。
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          NOTIFY_APP: research-desk
          NOTIFY_KIND: デプロイ
          NOTIFY_STATUS: ${{ steps.status.outputs.result }}
        run: bash .github/scripts/signaly-notify.sh

  notify-release:
    runs-on: ubuntu-latest
    needs: [tag, deploy, release]
    if: always() && needs.release.result != 'skipped'

    env:
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Signaly に通知
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          # リリースだけはCI・デプロイと別のチャンネルへ送る（guchi-apps/issue-deck#2391）。
          # 未登録なら空が渡り、スクリプトが従来のチャンネルへフォールバックする。
          SIGNALY_RELEASE_WEBHOOK_URL: ${{ secrets.SIGNALY_RELEASE_WEBHOOK_URL }}
          NOTIFY_STATUS: ${{ needs.release.result }}
          NOTIFY_APP: research-desk
          NOTIFY_KIND: リリース
          NOTIFY_VERSION: ${{ needs.tag.outputs.tag }}
        run: bash .github/scripts/signaly-notify.sh
