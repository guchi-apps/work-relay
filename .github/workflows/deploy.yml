name: Deploy to Production

# mainへのpushでVPSへ配る。**このファイルはissue-deckの画面の「新規アプリを立ち上げる」が
# 置いた雛形である**（guchi-apps/issue-deck#2247）。
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-research-desk-production
  cancel-in-progress: true

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create Git tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          HEAD_SHA=$(git rev-parse HEAD)

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-parse "$TAG")
            if [ "$TAG_SHA" = "$HEAD_SHA" ]; then
              echo "Tag ${TAG} already points to HEAD"
              exit 0
            fi
            echo "::error::Tag ${TAG} already exists on ${TAG_SHA}, but HEAD is ${HEAD_SHA}. Bump package.json version before merging."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

  release:
    runs-on: ubuntu-latest
    needs: [tag, deploy]
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect prerelease
        id: meta
        run: |
          TAG="${{ needs.tag.outputs.tag }}"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          skip_if_release_exists: true

  build:
    runs-on: ubuntu-latest
    needs: tag

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んで
    # いたが、サービスアカウントの日次レート制限を使い切ってフリート全体の
    # デプロイが止まった（guchi-apps/issue-deck#1302）。SERVER_*・SHARED_DB_*・SUPABASE_*
    # はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（guchi-apps/issue-deck#1307）。
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
      HOST: ${{ secrets.SERVER_HOST }}
      USERNAME: ${{ secrets.SERVER_USERNAME }}
      SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
      DB_HOST: ${{ secrets.SHARED_DB_HOST }}
      DB_PORT: ${{ secrets.SHARED_DB_PORT }}
      DB_USER: ${{ secrets.SHARED_DB_USER }}
      DB_PASSWORD: ${{ secrets.SHARED_DB_PASSWORD }}
      MIGRATE_DB_USER: ${{ secrets.SHARED_DB_MIGRATE_USER }}
      MIGRATE_DB_PASSWORD: ${{ secrets.SHARED_DB_MIGRATE_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_PROJECT_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      ALLOWED_GOOGLE_EMAILS: ${{ secrets.ALLOWED_GOOGLE_EMAILS }}
      INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
      ANALYSIS_WORKER_SECRET: ${{ secrets.ANALYSIS_WORKER_SECRET }}
      OPS_API_TOKEN: ${{ secrets.OPS_API_TOKEN }}
      COLLECTION_CRON_SECRET: ${{ secrets.COLLECTION_CRON_SECRET }}
      SHARE_SHORTCUT_TOKEN: ${{ secrets.SHARE_SHORTCUT_TOKEN }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      AIDE_BOT_URL: ${{ vars.AIDE_BOT_URL }}
      AIDE_BOT_TOKEN: ${{ secrets.AIDE_BOT_TOKEN }}
      AIDE_BOT_EMAIL: ${{ secrets.AIDE_BOT_EMAIL }}
      AIDE_IMAGE_MAIL_URL: ${{ vars.AIDE_IMAGE_MAIL_URL }}
      AIDE_IMAGE_MAIL_TOKEN: ${{ secrets.AIDE_IMAGE_MAIL_TOKEN }}
      AIDE_NEWS_MAIL_URL: ${{ vars.AIDE_NEWS_MAIL_URL }}
      AIDE_NEWS_MAIL_TOKEN: ${{ secrets.AIDE_NEWS_MAIL_TOKEN }}
      AIDE_TEXT_MAIL_URL: ${{ vars.AIDE_TEXT_MAIL_URL }}
      AIDE_TEXT_MAIL_TOKEN: ${{ secrets.AIDE_TEXT_MAIL_TOKEN }}
      SHARED_TOKEN_API_SECRET: ${{ secrets.SHARED_TOKEN_API_SECRET }}
      ISSUE_DECK_URL: ${{ vars.APP_BASE_URL }}
      TARGET_DIR: ${{ secrets.TARGET_DIR }}
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Construct DATABASE_URL
        run: bash scripts/construct-database-url.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:ci
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ env.DATABASE_URL }}
          # NEXT_PUBLIC_* はビルド時にバンドルへ埋め込まれるため、ここにも渡す。
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      - name: Create archive
        run: |
          tar -czf deploy.tar.gz \
            package.json \
            pnpm-lock.yaml \
            public \
            .next \
            prisma \
            deploy \
            scripts/construct-database-url.sh \
            scripts/update-env-file.sh \
            scripts/codex-analysis-worker.mjs \
            next.config.mjs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: deploy.tar.gz
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んで
    # いたが、サービスアカウントの日次レート制限を使い切ってフリート全体の
    # デプロイが止まった（guchi-apps/issue-deck#1302）。SERVER_*・SHARED_DB_*・SUPABASE_*
    # はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（guchi-apps/issue-deck#1307）。
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
      HOST: ${{ secrets.SERVER_HOST }}
      USERNAME: ${{ secrets.SERVER_USERNAME }}
      SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
      DB_HOST: ${{ secrets.SHARED_DB_HOST }}
      DB_PORT: ${{ secrets.SHARED_DB_PORT }}
      DB_USER: ${{ secrets.SHARED_DB_USER }}
      DB_PASSWORD: ${{ secrets.SHARED_DB_PASSWORD }}
      MIGRATE_DB_USER: ${{ secrets.SHARED_DB_MIGRATE_USER }}
      MIGRATE_DB_PASSWORD: ${{ secrets.SHARED_DB_MIGRATE_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_PROJECT_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      ALLOWED_GOOGLE_EMAILS: ${{ secrets.ALLOWED_GOOGLE_EMAILS }}
      INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
      ANALYSIS_WORKER_SECRET: ${{ secrets.ANALYSIS_WORKER_SECRET }}
      OPS_API_TOKEN: ${{ secrets.OPS_API_TOKEN }}
      COLLECTION_CRON_SECRET: ${{ secrets.COLLECTION_CRON_SECRET }}
      SHARE_SHORTCUT_TOKEN: ${{ secrets.SHARE_SHORTCUT_TOKEN }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      AIDE_BOT_URL: ${{ vars.AIDE_BOT_URL }}
      AIDE_BOT_TOKEN: ${{ secrets.AIDE_BOT_TOKEN }}
      AIDE_BOT_EMAIL: ${{ secrets.AIDE_BOT_EMAIL }}
      AIDE_IMAGE_MAIL_URL: ${{ vars.AIDE_IMAGE_MAIL_URL }}
      AIDE_IMAGE_MAIL_TOKEN: ${{ secrets.AIDE_IMAGE_MAIL_TOKEN }}
      AIDE_NEWS_MAIL_URL: ${{ vars.AIDE_NEWS_MAIL_URL }}
      AIDE_NEWS_MAIL_TOKEN: ${{ secrets.AIDE_NEWS_MAIL_TOKEN }}
      AIDE_TEXT_MAIL_URL: ${{ vars.AIDE_TEXT_MAIL_URL }}
      AIDE_TEXT_MAIL_TOKEN: ${{ secrets.AIDE_TEXT_MAIL_TOKEN }}
      SHARED_TOKEN_API_SECRET: ${{ secrets.SHARED_TOKEN_API_SECRET }}
      ISSUE_DECK_URL: ${{ vars.APP_BASE_URL }}
      TARGET_DIR: ${{ secrets.TARGET_DIR }}
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: ./

      - name: Construct DATABASE_URL
        run: bash scripts/construct-database-url.sh

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ env.SSH_PRIVATE_KEY }}
          known_hosts: placeholder
          if_key_exists: replace

      - name: Add known hosts
        run: ssh-keyscan -p "${SSH_PORT}" -H "${HOST}" >> ~/.ssh/known_hosts
        env:
          HOST: ${{ env.HOST }}
          SSH_PORT: ${{ env.SSH_PORT }}

      - name: Upload archive
        run: scp -P "${SSH_PORT}" deploy.tar.gz "${USERNAME}@${HOST}:${TARGET_DIR}/deploy.tar.gz"
        env:
          HOST: ${{ env.HOST }}
          USERNAME: ${{ env.USERNAME }}
          SSH_PORT: ${{ env.SSH_PORT }}
          TARGET_DIR: ${{ env.TARGET_DIR }}

      - name: Deploy and restart
        uses: appleboy/ssh-action@v1
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          MIGRATE_DATABASE_URL: ${{ env.MIGRATE_DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          ALLOWED_GOOGLE_EMAILS: ${{ env.ALLOWED_GOOGLE_EMAILS }}
          INTERNAL_API_KEY: ${{ env.INTERNAL_API_KEY }}
          ANALYSIS_WORKER_SECRET: ${{ env.ANALYSIS_WORKER_SECRET }}
          OPS_API_TOKEN: ${{ env.OPS_API_TOKEN }}
          COLLECTION_CRON_SECRET: ${{ env.COLLECTION_CRON_SECRET }}
          SHARE_SHORTCUT_TOKEN: ${{ env.SHARE_SHORTCUT_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ env.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ env.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ env.VAPID_SUBJECT }}
          AIDE_BOT_URL: ${{ env.AIDE_BOT_URL }}
          AIDE_BOT_TOKEN: ${{ env.AIDE_BOT_TOKEN }}
          AIDE_BOT_EMAIL: ${{ env.AIDE_BOT_EMAIL }}
          AIDE_IMAGE_MAIL_URL: ${{ env.AIDE_IMAGE_MAIL_URL }}
          AIDE_IMAGE_MAIL_TOKEN: ${{ env.AIDE_IMAGE_MAIL_TOKEN }}
          AIDE_NEWS_MAIL_URL: ${{ env.AIDE_NEWS_MAIL_URL }}
          AIDE_NEWS_MAIL_TOKEN: ${{ env.AIDE_NEWS_MAIL_TOKEN }}
          AIDE_TEXT_MAIL_URL: ${{ env.AIDE_TEXT_MAIL_URL }}
          AIDE_TEXT_MAIL_TOKEN: ${{ env.AIDE_TEXT_MAIL_TOKEN }}
          SHARED_TOKEN_API_SECRET: ${{ env.SHARED_TOKEN_API_SECRET }}
          ISSUE_DECK_URL: ${{ env.ISSUE_DECK_URL }}
          TARGET_DIR: ${{ env.TARGET_DIR }}
          # 稼働している版の照合に使う（#302）。ヘルスチェックが `/api/app-version` の `sha` と突き合わせる。
          # コミットの SHA は公開情報なのでそのまま渡してよい
          APP_COMMIT_SHA: ${{ github.sha }}
        with:
          host: ${{ env.HOST }}
          username: ${{ env.USERNAME }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          port: ${{ env.SSH_PORT }}
          # ここに無い変数はSSH先に存在しない。env: と同じ名前を必ず並べる。
          envs: APP_COMMIT_SHA,DATABASE_URL,MIGRATE_DATABASE_URL,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,ALLOWED_GOOGLE_EMAILS,INTERNAL_API_KEY,ANALYSIS_WORKER_SECRET,OPS_API_TOKEN,COLLECTION_CRON_SECRET,SHARE_SHORTCUT_TOKEN,VAPID_PUBLIC_KEY,VAPID_PRIVATE_KEY,VAPID_SUBJECT,AIDE_BOT_URL,AIDE_BOT_TOKEN,AIDE_BOT_EMAIL,AIDE_IMAGE_MAIL_URL,AIDE_IMAGE_MAIL_TOKEN,AIDE_NEWS_MAIL_URL,AIDE_NEWS_MAIL_TOKEN,AIDE_TEXT_MAIL_URL,AIDE_TEXT_MAIL_TOKEN,SHARED_TOKEN_API_SECRET,ISSUE_DECK_URL,TARGET_DIR
          script: |
            set -euo pipefail
            cd "${TARGET_DIR}"

            # 待受ポートはシークレットではなく設定値として平文で持つ
            # （guchi-apps/docs の standards/ports.md「ポート番号は 1Password で管理しない」）。
            PORT=3115

            echo "Cleaning up old release files..."
            # 配布物を増やしたらこの行にも足す。永続させたいディレクトリは絶対に入れない。
            # next.config.ts は旧配布物の残り（next.config.mjs へ置き換えた）。本番に残っている古い方を消すため外さない。
            rm -rf package.json pnpm-lock.yaml public .next prisma deploy scripts next.config.mjs next.config.ts

            echo "Extracting archive..."
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz

            update_env() {
              bash scripts/update-env-file.sh .env "$1" "$2"
            }

            echo "Updating .env..."
            update_env NODE_ENV production
            update_env PORT "$PORT"
            update_env APP_COMMIT_SHA "$APP_COMMIT_SHA"
            update_env DATABASE_URL "$DATABASE_URL"
            update_env NEXT_PUBLIC_SUPABASE_URL "$NEXT_PUBLIC_SUPABASE_URL"
            update_env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
            update_env ALLOWED_GOOGLE_EMAILS "$ALLOWED_GOOGLE_EMAILS"
            update_env INTERNAL_API_KEY "$INTERNAL_API_KEY"
            update_env ANALYSIS_WORKER_SECRET "$ANALYSIS_WORKER_SECRET"
            update_env OPS_API_TOKEN "$OPS_API_TOKEN"
            update_env COLLECTION_CRON_SECRET "$COLLECTION_CRON_SECRET"
            update_env SHARE_SHORTCUT_TOKEN "$SHARE_SHORTCUT_TOKEN"
            update_env VAPID_PUBLIC_KEY "$VAPID_PUBLIC_KEY"
            update_env VAPID_PRIVATE_KEY "$VAPID_PRIVATE_KEY"
            update_env VAPID_SUBJECT "$VAPID_SUBJECT"
            update_env AIDE_BOT_URL "$AIDE_BOT_URL"
            update_env AIDE_BOT_TOKEN "$AIDE_BOT_TOKEN"
            update_env AIDE_BOT_EMAIL "$AIDE_BOT_EMAIL"
            update_env AIDE_IMAGE_MAIL_URL "$AIDE_IMAGE_MAIL_URL"
            update_env AIDE_IMAGE_MAIL_TOKEN "$AIDE_IMAGE_MAIL_TOKEN"
            update_env AIDE_NEWS_MAIL_URL "$AIDE_NEWS_MAIL_URL"
            update_env AIDE_NEWS_MAIL_TOKEN "$AIDE_NEWS_MAIL_TOKEN"
            update_env AIDE_TEXT_MAIL_URL "$AIDE_TEXT_MAIL_URL"
            update_env AIDE_TEXT_MAIL_TOKEN "$AIDE_TEXT_MAIL_TOKEN"
            update_env SHARED_TOKEN_API_SECRET "$SHARED_TOKEN_API_SECRET"
            update_env ISSUE_DECK_URL "$ISSUE_DECK_URL"

            echo "Installing production dependencies..."
            corepack enable pnpm >/dev/null 2>&1 || true
            pnpm install --prod --frozen-lockfile

            echo "Applying database migrations..."
            DATABASE_URL="$MIGRATE_DATABASE_URL" pnpm exec prisma migrate deploy

            echo "Restarting PM2..."
            if command -v pm2 >/dev/null 2>&1; then
              # 記事AI解析のポーラー（#86）もこの ecosystem に入っている。名前を挙げて
              # 消さないと古いプロセスが残り、新しい配布物で起動し直されない。
              pm2 delete research-desk 2>/dev/null || true
              pm2 delete research-desk-analysis-worker 2>/dev/null || true
              PORT="$PORT" pm2 start deploy/ecosystem.config.js --env production
              pm2 save
            else
              echo "pm2 is required on the server. Install: npm install -g pm2"
              exit 1
            fi

            echo "Health check..."
            # Next.js は起動完了までに数秒かかる。1回だけのcurlでは起動が間に合わずに
            # 失敗するため、一定時間リトライする。
            # `/` は旧版が動いたままでも応答を返すため、HTTP 200 だけでは成功にしない。
            # `/api/app-version`（proxy.tsのmatcher外なので未ログインで取れる）が返す `sha` が
            # 今回デプロイしたコミット（APP_COMMIT_SHA）と一致するまで待つ（#302）。
            APP_OK=0
            body=""
            for i in $(seq 1 30); do
              body="$(curl -fsS --max-time 5 "http://127.0.0.1:${PORT}/api/app-version" 2>/dev/null || true)"
              if [ -n "$body" ] && printf '%s' "$body" | grep -qF "\"sha\":\"${APP_COMMIT_SHA}\""; then
                APP_OK=1
                break
              fi
              sleep 2
            done

            if [ "$APP_OK" != 1 ]; then
              echo "Health check failed after 60s: /api/app-version did not report sha=${APP_COMMIT_SHA}."
              echo "last response: ${body:-<none>}"
              pm2 describe research-desk || true
              pm2 logs research-desk --lines 50 --nostream || true
              exit 1
            fi
            echo "Running sha=${APP_COMMIT_SHA}"

            # 記事AI解析のポーラー（#86）。**落ちていてもデプロイは失敗させない**——
            # 解析が動かないだけで、収集・週報・画面表示は影響を受けないため。
            # ポーラーは共有シークレット未設定でもプロセスを終わらせない作りなので、
            # ここが online でなければ配布か起動そのものの問題。
            if pm2 describe research-desk-analysis-worker 2>/dev/null | grep -q "online"; then
              echo "Analysis worker is online."
            else
              echo "::warning::記事AI解析のポーラー（research-desk-analysis-worker）が起動していません。pm2 logs research-desk-analysis-worker で確認してください。"
              pm2 logs research-desk-analysis-worker --lines 30 --nostream || true
            fi

            echo "Deployment successful."
            exit 0

      # **deployジョブの成功は公開できたことを保証しない**（guchi-apps/issue-deck#2252）。
      # 上のヘルスチェックが叩くのはVPS内の127.0.0.1で、ApacheのVirtualHostが無くても通る。
      # ここで公開URLを外から引き、DNS・Apache・TLSまで通っているかを確かめる。
      #
      # **失敗させない。** certbot前・DNS未反映の初回デプロイは必ず落ちるため、
      # 警告として出すだけにする（初回だけの分岐も持たない。2回目以降もApacheの設定や
      # プロセスが壊れていれば拾えるほうがよい）。
      - name: 公開URLの疎通を確認する（警告のみ）
        continue-on-error: true
        run: |
          URL="https://research-desk.gucchii.com/"
          # 失敗時もcurl自身が %{http_code} に 000 を出す。パイプで 000 を足すと
          # 2行になって数値比較が壊れるので、終了コードだけを握りつぶす
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' -I --max-time 20 "$URL") || true
          [ -n "$CODE" ] || CODE=000
          if [ "$CODE" -ge 200 ] && [ "$CODE" -lt 400 ]; then
            echo "$URL -> $CODE"
          else
            echo "::warning::$URL が開けませんでした（HTTP $CODE）。デプロイ自体は成功しています。DNSのAレコード・ApacheのVirtualHost・TLS証明書を確認してください。"
          fi

  notify:
    runs-on: ubuntu-latest
    needs: [tag, build, deploy]
    if: always()

    env:
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine workflow status
        id: status
        run: |
          tag="${{ needs.tag.result }}"
          build="${{ needs.build.result }}"
          deploy="${{ needs.deploy.result }}"
          if [ "$tag" = "success" ] && [ "$build" = "success" ] && [ "$deploy" = "success" ]; then
            result=success
          elif [ "$tag" = "cancelled" ] || [ "$build" = "cancelled" ] || [ "$deploy" = "cancelled" ]; then
            result=cancelled
          else
            result=failure
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Signaly に通知
        # 通知はCIやデプロイの合否そのものではない。ここが失敗してもrun全体を
        # 落とさない（guchi-apps/issue-deck#1302）。
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          NOTIFY_APP: research-desk
          NOTIFY_KIND: デプロイ
          NOTIFY_STATUS: ${{ steps.status.outputs.result }}
        run: bash .github/scripts/signaly-notify.sh

  notify-release:
    runs-on: ubuntu-latest
    needs: [tag, deploy, release]
    if: always() && needs.release.result != 'skipped'

    env:
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Signaly に通知
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          # リリースだけはCI・デプロイと別のチャンネルへ送る（guchi-apps/issue-deck#2391）。
          # 未登録なら空が渡り、スクリプトが従来のチャンネルへフォールバックする。
          SIGNALY_RELEASE_WEBHOOK_URL: ${{ secrets.SIGNALY_RELEASE_WEBHOOK_URL }}
          NOTIFY_STATUS: ${{ needs.release.result }}
          NOTIFY_APP: research-desk
          NOTIFY_KIND: リリース
          NOTIFY_VERSION: ${{ needs.tag.outputs.tag }}
        run: bash .github/scripts/signaly-notify.sh
